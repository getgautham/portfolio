<style>
  :root {
    --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Switzer","Inter",system-ui,sans-serif;
    --round:ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;
    --blue:#007AFF;
    --bg:#f2f2f7; --glass:rgba(255,255,255,.74); --glass-solid:#fff; --ink:#000; --ink-2:rgba(60,60,67,.6);
    --sep:rgba(60,60,67,.18); --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.2);
    --shadow:0 8px 32px rgba(0,0,0,.14), 0 1px 3px rgba(0,0,0,.08);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --peek:calc(176px + var(--safe-b));
  }
  :root[data-theme="dark"] {
    --blue:#0A84FF;
    --bg:#000; --glass:rgba(30,30,32,.74); --glass-solid:#1c1c1e; --ink:#fff; --ink-2:rgba(235,235,245,.6);
    --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.32);
    --shadow:0 8px 32px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:var(--sys); -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  .glass { background:var(--glass); -webkit-backdrop-filter:saturate(180%) blur(22px); backdrop-filter:saturate(180%) blur(22px); box-shadow:var(--shadow); }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  #map { position:fixed; inset:0; }

  /* ---------- top bar ---------- */
  .top { position:fixed; z-index:5; top:calc(12px + var(--safe-t)); left:12px; display:flex; align-items:center; gap:10px; padding:6px 16px 6px 6px; border-radius:999px; max-width:calc(100vw - 84px); }
  .top .back { width:34px; height:34px; border-radius:999px; display:grid; place-items:center; background:var(--fill); flex:none; }
  .top img { width:34px; height:34px; border-radius:999px; object-fit:cover; object-position:center 20%; flex:none; }
  .top .t { min-width:0; }
  .top .t b { display:block; font-size:15px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; }
  .top .t span { display:block; font-size:12px; color:var(--ink-2); white-space:nowrap; }

  /* ---------- floating controls (top right, Apple Maps style) ---------- */
  .ctrls { position:fixed; z-index:5; top:calc(12px + var(--safe-t)); right:12px; display:flex; flex-direction:column; border-radius:12px; overflow:hidden; }
  .ctrls button { width:46px; height:46px; display:grid; place-items:center; color:var(--blue); }
  .ctrls button + button { border-top:.5px solid var(--sep); }
  .ctrls button:active { background:var(--fill); }
  .ctrls svg { width:22px; height:22px; }

  /* ---------- bottom sheet ---------- */
  .sheet { position:fixed; z-index:6; left:0; right:0; bottom:0; height:calc(92dvh - var(--safe-t)); border-radius:14px 14px 0 0; display:flex; flex-direction:column; transform:translateY(calc(100% - var(--peek))); transition:transform .42s cubic-bezier(.2,.9,.25,1); will-change:transform; touch-action:none; }
  .sheet.dragging { transition:none; }
  .handle { padding:6px 16px 0; flex:none; cursor:grab; }
  .grab { width:36px; height:5px; border-radius:3px; background:var(--fill-2); margin:0 auto 10px; }
  .body { flex:1; overflow-y:hidden; overscroll-behavior:contain; padding:0 16px calc(24px + var(--safe-b)); touch-action:none; }
  .sheet.full .body { overflow-y:auto; touch-action:pan-y; -webkit-overflow-scrolling:touch; }
  .body::-webkit-scrollbar { display:none; }

  .h1 { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .h1 h1 { font-size:22px; line-height:1.15; font-weight:700; letter-spacing:-.02em; margin:0; }
  .pill { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 14px; border-radius:999px; background:var(--blue); color:#fff; font-size:14px; font-weight:600; flex:none; }
  .pill svg { width:15px; height:15px; }
  .pill:active { opacity:.75; }

  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0 14px; }
  .stat { background:var(--fill); border-radius:12px; padding:9px 12px; }
  .stat b { display:block; font-family:var(--round); font-size:24px; font-weight:700; letter-spacing:-.02em; line-height:1.1; font-variant-numeric:tabular-nums; }
  .stat span { font-size:12px; color:var(--ink-2); }

  .chips { display:flex; gap:6px; overflow-x:auto; margin:0 -16px; padding:0 16px 12px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; height:32px; padding:0 13px; border-radius:999px; background:var(--fill); font-size:14px; font-weight:500; display:inline-flex; align-items:center; gap:6px; }
  .chip[aria-pressed="true"] { background:var(--ink); color:var(--bg); }

  .group { margin-top:14px; }
  .group h2 { font-size:13px; font-weight:600; color:var(--ink-2); text-transform:uppercase; letter-spacing:.02em; margin:0 0 6px 4px; }
  .list { background:var(--glass-solid); border-radius:12px; overflow:hidden; }
  :root[data-theme="dark"] .list { background:rgba(255,255,255,.06); }
  .item { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:10px 12px; position:relative; }
  .item + .item::before { content:""; position:absolute; top:0; left:62px; right:0; border-top:.5px solid var(--sep); }
  .item:active { background:var(--fill); }
  .dot { width:38px; height:38px; border-radius:999px; display:grid; place-items:center; font-size:19px; flex:none; background:var(--c); box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1); }
  .item .tx { flex:1; min-width:0; }
  .item .tx b { display:block; font-size:16px; font-weight:500; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .tx span { display:block; font-size:13px; color:var(--ink-2); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .chev { color:var(--ink-2); opacity:.6; flex:none; }

  .foot { margin:22px 4px 0; font-size:12px; color:var(--ink-2); line-height:1.5; }
  .foot a { color:var(--blue); }

  /* ---------- place detail (lives in the sheet) ---------- */
  .detail[hidden], .browse[hidden] { display:none; }
  .dhead { display:flex; align-items:flex-start; gap:12px; }
  .dhead .dot { width:52px; height:52px; font-size:26px; }
  .dhead .tx { flex:1; min-width:0; }
  .dhead h1 { font-size:24px; line-height:1.15; font-weight:700; letter-spacing:-.02em; margin:2px 0 3px; }
  .dhead p { margin:0; font-size:14px; color:var(--ink-2); }
  .close { width:30px; height:30px; border-radius:999px; background:var(--fill); display:grid; place-items:center; color:var(--ink-2); flex:none; }
  .acts { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0; }
  .act { background:var(--fill); border-radius:12px; padding:10px 6px 8px; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--blue); font-size:12px; font-weight:500; }
  .act.primary { background:var(--blue); color:#fff; }
  .act svg { width:22px; height:22px; }
  .act:active { opacity:.7; }
  .note { background:var(--glass-solid); border-radius:12px; padding:14px; font-size:16px; line-height:1.45; margin:0; }
  :root[data-theme="dark"] .note { background:rgba(255,255,255,.06); }
  .note small { display:block; font-size:12px; color:var(--ink-2); margin-bottom:6px; text-transform:uppercase; letter-spacing:.02em; font-weight:600; }
  .nearby { margin-top:16px; }

  /* ---------- pins ---------- */
  .pin { width:40px; height:40px; cursor:pointer; }
  .pin i { position:absolute; left:2px; top:2px; width:36px; height:36px; border-radius:999px; background:var(--c); border:2.5px solid #fff; display:grid; place-items:center; font-style:normal; font-size:18px; box-shadow:0 3px 10px rgba(0,0,0,.3); transition:transform .25s cubic-bezier(.3,1.6,.5,1); transform-origin:50% 100%; }
  .pin:hover i { transform:scale(1.1); }
  .pin.on { z-index:3; }
  .pin.on i { transform:scale(1.35) translateY(-8px); }
  .pin.on i::after { content:""; position:absolute; left:50%; bottom:-8px; margin-left:-5px; border:5px solid transparent; border-top-color:#fff; border-bottom:0; }
  .pin.off { opacity:.25; pointer-events:none; }
  /* Zoomed out, pins shrink to dots so clusters (a campus, the CBD) stay readable. */
  #map.far .pin:not(.on) i { left:12px; top:20px; width:16px; height:16px; border-width:2px; font-size:0; box-shadow:0 1px 4px rgba(0,0,0,.35); }
  #map.far .pin:not(.on) { width:40px; height:40px; }
  .pin.pop i { animation:drop .55s cubic-bezier(.3,1.5,.5,1) both; animation-delay:var(--d,0s); }
  @keyframes drop { from { transform:translateY(-40px) scale(.4); opacity:0; } to { transform:none; opacity:1; } }

  /* ---------- poster preview ---------- */
  .modal { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.55); display:grid; place-items:center; padding:calc(20px + var(--safe-t)) 20px calc(20px + var(--safe-b)); }
  .modal[hidden] { display:none; }
  .mcard { width:min(400px,100%); max-height:100%; display:flex; flex-direction:column; gap:12px; border-radius:20px; padding:14px; background:var(--glass-solid); }
  .mcard .img { flex:1; min-height:0; display:grid; place-items:center; }
  .mcard img { max-width:100%; max-height:calc(100dvh - 190px); border-radius:12px; display:block; }
  .mcard p { margin:0; text-align:center; font-size:13px; color:var(--ink-2); }
  .mrow { display:flex; gap:8px; }
  .mrow button, .mrow a { flex:1; height:46px; border-radius:12px; display:grid; place-items:center; font-weight:600; font-size:16px; background:var(--fill); color:var(--blue); }
  .mrow .primary { background:var(--blue); color:#fff; }
  .spinner { width:28px; height:28px; border-radius:999px; border:3px solid var(--fill-2); border-top-color:var(--blue); animation:spin .8s linear infinite; margin:60px auto; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .toast { position:fixed; z-index:30; left:50%; top:calc(70px + var(--safe-t)); transform:translate(-50%,-20px); opacity:0; padding:10px 18px; border-radius:999px; font-size:14px; font-weight:600; transition:.3s; pointer-events:none; }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  .maplibregl-ctrl-bottom-right { bottom:calc(var(--peek) + 4px); transition:bottom .3s; }
  .maplibregl-ctrl-attrib { font-size:10px; }

  /* ---------- desktop: the sheet becomes a floating sidebar, like Maps on Mac ---------- */
  @media (min-width:800px) {
    .top { left:16px; top:16px; }
    .ctrls { right:16px; top:16px; }
    .sheet { left:16px; right:auto; top:76px; bottom:16px; width:372px; height:auto; border-radius:16px; transform:none !important; transition:none; touch-action:auto; }
    .handle { padding-top:16px; cursor:default; }
    .body { overflow-y:auto; touch-action:auto; }
    .grab { display:none; }
    .maplibregl-ctrl-bottom-right { bottom:0; }
  }
  @media (prefers-reduced-motion:reduce) {
    .sheet, .pin i, .toast { transition:none; }
    .pin.pop i { animation:none; }
  }
</style>

<body>

  <script src="vendor/maplibre-gl.js"></script>
  <script src="places.js"></script>
  <script>
  (function () {
    "use strict";

    var PLACES = (window.PLACES || []).slice();
    var KINDS = {
      library: { label: "Libraries", icon: "📚", c: "#FF9F0A" },
      campus:  { label: "Campuses", icon: "🎓", c: "#5856D6" },
      eat:     { label: "Eat",     icon: "🍜", c: "#FF9500" },
      drink:   { label: "Drink",   icon: "☕️", c: "#A2845E" },
      view:    { label: "Views",   icon: "🌅", c: "#30B0C7" },
      nature:  { label: "Nature",  icon: "🌿", c: "#34C759" },
      culture: { label: "Culture", icon: "🏛️", c: "#FF2D55" },
      stay:    { label: "Stay",    icon: "🛏️", c: "#64D2FF" },
      night:   { label: "Night",   icon: "🪩", c: "#AF52DE" }
    };
    var STYLES = {
      light: "https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json",
      dark:  "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json"
    };
    var SITE = "gautham.live/map";
    var META = window.MAP_META || {};
    var TITLE = META.title || "Places I've been", TAGLINE = META.tagline || "The coolest spots, pinned.";
    var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    var isDesk = function () { return matchMedia("(min-width: 800px)").matches; };
    var $ = function (id) { return document.getElementById(id); };

    PLACES.forEach(function (p) { if (!KINDS[p.kind]) p.kind = "view"; p.emoji = p.emoji || KINDS[p.kind].icon; });

    function flag(cc) {
      if (!cc || cc.length !== 2) return "";
      return String.fromCodePoint.apply(null, cc.toUpperCase().split("").map(function (ch) { return 0x1f1a5 + ch.charCodeAt(0); }));
    }
    function month(w) {
      if (!w) return "";
      var d = new Date(w + "-01T00:00:00");
      return isNaN(d) ? w : d.toLocaleDateString("en-AU", { month: "short", year: "numeric" });
    }
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    function uniq(arr) { return arr.filter(function (v, i) { return arr.indexOf(v) === i; }); }
    function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove("show"); }, 1800); }
    function km(a, b) {
      var R = 6371, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
      var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 2 * R * Math.asin(Math.sqrt(h));
    }

    var countries = uniq(PLACES.map(function (p) { return p.country; }));
    var cities = uniq(PLACES.map(function (p) { return p.city + "|" + p.country; }));
    var libs = PLACES.filter(function (p) { return p.kind === "library"; }).length;
    var stats = { spots: PLACES.length, cities: cities.length, countries: countries.length };
    // Three tiles, picked to say the most about what is on the map right now.
    var tiles = [[stats.spots, "Spots"]];
    tiles.push(libs ? [libs, "Libraries"] : [stats.cities, "Cities"]);

      try { posterBlob = await makePoster(p); } catch (e) { posterBlob = null; }
      if (!posterBlob) { $("m-img").innerHTML = '<p>Could not make the card. Sharing the link instead works too.</p>'; return; }
      var url = URL.createObjectURL(posterBlob);
      $("m-img").innerHTML = '<img alt="Share card" src="' + url + '" />';
      $("m-hint").textContent = navigator.canShare ? "Made for stories. Share it, or save it to Photos." : "Made for stories. Download it, or right-click to save.";
      $("m-share").textContent = canShareFile() ? "Share" : "Download";
    }
    function canShareFile() {
      try { return !!(navigator.canShare && posterBlob && navigator.canShare({ files: [new File([posterBlob], posterName, { type: "image/png" })] })); } catch (e) { return false; }
    }
    function closeModal() { $("modal").hidden = true; }
    $("m-close").addEventListener("click", closeModal);
    $("modal").addEventListener("click", function (e) { if (e.target === $("modal")) closeModal(); });
    $("m-share").addEventListener("click", function () {
      if (!posterBlob) return shareLink(posterPlace);
      var link = location.origin + location.pathname + (posterPlace ? "#" + posterPlace.id : "");
      if (canShareFile()) {
        navigator.share({ files: [new File([posterBlob], posterName, { type: "image/png" })], title: "Gautham's Map", text: link }).catch(function () {});
      } else {
        var a = document.createElement("a"); a.href = URL.createObjectURL(posterBlob); a.download = posterName; document.body.appendChild(a); a.click(); a.remove();
      }
    });
    $("btn-share").addEventListener("click", function () { openPoster(selected); });
    $("btn-share-2").addEventListener("click", function () { openPoster(null); });
    $("d-card").addEventListener("click", function () { openPoster(selected); });
  })();
  </script>
</body>
</html>
